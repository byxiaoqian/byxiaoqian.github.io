name: 名人堂设置同步

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: hof-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: sync
        run: python3 .github/scripts/hof_sync.py
        env:
          FORUM_USERNAME: ${{ secrets.FORUM_USERNAME }}
          FORUM_PASSWORD: ${{ secrets.FORUM_PASSWORD }}
          HOF_DEBUG: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
      - if: steps.sync.outputs.message != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -am "${{ steps.sync.outputs.message }}"
          git push
